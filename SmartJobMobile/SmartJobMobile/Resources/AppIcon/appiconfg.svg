<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Verteco "V" mark - a bold geometric chevron in the app's own
     accent red (#ED3B3B), replacing the default .NET wordmark.
     Kept within the center safe zone of the 456x456 canvas so it
     isn't clipped by Android's adaptive-icon masking. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <path
        d="M 100,130 L 170,130 L 228,255 L 286,130 L 356,130 L 228,340 Z"
        fill="#ED3B3B" />
</svg>
