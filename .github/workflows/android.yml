name: SmartJob Android Build

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android project
        run: >
          dotnet restore
          ./SmartJobMobile/SmartJobMobile/SmartJobMobile.csproj
          -p:TargetFramework=net10.0-android

      - name: Build unsigned Android APK for pull request
        if: github.event_name == 'pull_request'
        run: >
          dotnet publish
          ./SmartJobMobile/SmartJobMobile/SmartJobMobile.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false

      - name: Create Android signing keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/android-signing"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/android-signing/smartjob-release.jks"

          test -s "$RUNNER_TEMP/android-signing/smartjob-release.jks"

          echo "Android keystore reconstructed successfully."

      - name: Validate Android signing keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$RUNNER_TEMP/android-signing/smartjob-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /dev/null

          echo "Keystore password and key alias are valid."

      - name: Build signed Android APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish
          ./SmartJobMobile/SmartJobMobile/SmartJobMobile.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ runner.temp }}/android-signing/smartjob-release.jks
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Verify APK
        shell: bash
        run: |
          echo "Generated Android APKs:"

          find \
            ./SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find \
            ./SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK was generated."
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smartjob-android-apk
          path: SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 14