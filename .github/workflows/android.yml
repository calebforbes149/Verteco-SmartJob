name: SmartJob Android Build

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Display installed workloads
        run: dotnet workload list

      - name: Restore Android project
        run: >
          dotnet restore
          ./SmartJobMobile/SmartJobMobile/SmartJobMobile.csproj
          -p:TargetFramework=net10.0-android

      - name: Build Android Release
        run: >
          dotnet publish
          ./SmartJobMobile/SmartJobMobile/SmartJobMobile.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false

      - name: Verify APK was generated
        run: |
          echo "Generated Android packages:"
          find ./SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish -type f -name "*.apk" -print

          APK_COUNT=$(find ./SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APK was generated."
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: smartjob-android-apk
          path: SmartJobMobile/SmartJobMobile/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 14