name: SmartJob Main Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Test before deployment
    uses: ./.github/workflows/main-tests.yml

  deploy:
    name: Deploy API and web
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: smartjob-main-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./VertecoSmartJob.slnx

      - name: Publish API
        run: >
          dotnet publish
          ./src/VertecoSmartJob.Api/VertecoSmartJob.Api.csproj
          --configuration Release
          --no-restore
          -p:UseAppHost=false
          --output "${{ runner.temp }}/smartjob-api"

      - name: Publish web
        run: >
          dotnet publish
          ./src/VertecoSmartJob.Web/VertecoSmartJob.Web.csproj
          --configuration Release
          --no-restore
          -p:UseAppHost=false
          --output "${{ runner.temp }}/smartjob-web"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: verteco-smartjob-api
          package: ${{ runner.temp }}/smartjob-api

      - name: Check API readiness
        run: >
          curl --fail --silent --show-error
          --retry 12 --retry-delay 10 --retry-all-errors
          https://verteco-smartjob-api-hcdyfgf4cagdh2db.southafricanorth-01.azurewebsites.net/health/ready

      - name: Deploy web App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: verteco-smartjob-web
          package: ${{ runner.temp }}/smartjob-web

      - name: Check web health
        run: >
          curl --fail --silent --show-error
          --retry 12 --retry-delay 10 --retry-all-errors
          https://verteco-smartjob-web-ctatfjduapbcdzb5.southafricanorth-01.azurewebsites.net/health/live
