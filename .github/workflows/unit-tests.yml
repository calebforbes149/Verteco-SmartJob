name: SmartJob All Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run all tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore ./VertecoSmartJob.slnx

      # No test filter: runs every test in every test project in the solution.
      - name: Run unit and integration tests with coverage
        run: >-
          dotnet test ./VertecoSmartJob.slnx
          --configuration Release
          --no-restore
          --verbosity normal
          --logger "trx;LogFilePrefix=tests"
          --results-directory ./TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartjob-test-results-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
